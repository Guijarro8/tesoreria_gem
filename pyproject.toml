[project]
name = "tesoreria-gem"
version = "0.1.0"
description = "Cargar extracto bancario en hoja de cálculo de Google Sheets"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gspread>=6.2.0",
    "pandas>=2.2.3",
    "streamlit>=1.43.2",
    "xlrd>=2.0.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "pytest>=8.3.0",
    "ruff>=0.11.0",
    "ty>=0.0.91",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.rules]
missing-type-argument = "error"
unsound-assignment = "error"
unsound-return-statement = "error"
